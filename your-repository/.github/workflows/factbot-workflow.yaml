name: Run Discord Bot (Python)

on:
  schedule:
    - cron: '*/5 * * * *'  # Setiap 5 menit
  push:
    branches:
      - main  # Menjalankan workflow saat ada perubahan di branch 'main'

jobs:
  run:
    runs-on: ubuntu-latest  # Pilih sistem operasi tempat workflow dijalankan

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Menginstall dependensi dari requirements.txt

      - name: Run bot
        run: python factbot.py
        env:
          DISCORD_TOKEN: ${{ secrets.MTMyOTQ3MzE5NDk2ODYxMjk1NA.Gfz5-I.pu3E87k-AUGelPVXD2HCYeaQewjAacM1KOGCCw }}
